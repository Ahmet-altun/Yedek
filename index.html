<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yedek telefon</title>
<style>body{font-family:system-ui,sans-serif;background:#101418;color:#e8edf2;margin:0;padding:24px;max-width:480px;margin:auto}
h1{font-size:22px}p{color:#a9b4bf;line-height:1.5}button{font-size:17px;padding:14px 20px;border:0;border-radius:14px;margin:6px 6px 6px 0}
.ok{background:#2e7d32;color:#fff}.no{background:#37424d;color:#fff}.bar{background:#1b5e20;border-radius:14px;padding:14px;margin:14px 0}
#log{font-size:13px;color:#9fb0bf;white-space:pre-wrap}</style></head><body>
<h1 id="t">Yedek telefon</h1><div id="m"></div><div id="b"></div><div id="log"></div>
<script>
var RELAY="https://ntfy.sh",$=function(i){return document.getElementById(i)},enc=new TextEncoder(),dec=new TextDecoder();
function ub(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function b64(a){var s="";a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function hex(a){return Array.prototype.map.call(new Uint8Array(a),function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
var SAYFA_SURUM="191",dirH=null,msgEl=null,tracking=false,lastPos=null,watchId=null,allowCam=false,torchTrack=null,code=decodeURIComponent(location.hash.slice(1)),parts=code.split("."),sec,name,key,tc,tr,stopped=false,seen={},ctx,osc,wake;
function log(s){$("log").textContent=new Date().toLocaleTimeString()+" · "+s+"\n"+$("log").textContent}
async function topic(d){var h=await crypto.subtle.digest("SHA-256",new Uint8Array([].concat(Array.from(sec),Array.from(enc.encode("|arche-spare|"+d)))));return"arche"+hex(h).slice(0,40)}
async function seal(t){var iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(t))),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function open(s){var a=ub(s.trim());return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12)))}
function start(){
 if(parts.length!=2){$("m").innerHTML="<p>Geçersiz bağlantı.</p>";return}
 try{sec=ub(parts[0]);name=dec.decode(ub(parts[1]))}catch(e){$("m").innerHTML="<p>Geçersiz bağlantı.</p>";return}
 if(sec.length!=32){$("m").innerHTML="<p>Geçersiz bağlantı.</p>";return}
 $("t").textContent="Erişime izin ver?";
 $("m").innerHTML="<p><b></b> bu telefonun <b>konumunu</b> görmek, telefonu <b>çaldırmak</b> ve <b>durumunu</b> (pil, ağ) sorgulamak istiyor.</p><p>Bu telefon sana, “<span id=n2></span>” da senin telefonunsa onayla. Bağlantıyı sana başkası gönderdiyse <b>Reddet</b>.</p><p><label><input type=checkbox id=cam> Kameraya da izin ver (fotoğraf çekme, fener). Çekim sırasında ekranda kırmızı uyarı görünür.</label></p><p>Bu sayfa açık kaldığı sürece erişim sürer. Kapatınca ya da Kes'e basınca biter.</p>";
 $("m").getElementsByTagName("b")[0].textContent=name;$("n2").textContent=name;
 $("b").innerHTML='<button class="ok" id="y">Onayla</button><button class="no" id="x">Reddet</button>';
 $("x").onclick=function(){document.body.innerHTML="<p>Reddedildi. Sayfayı kapatabilirsin.</p>"};
 $("y").onclick=go}
async function go(){
 allowCam=!!($("cam")&&$("cam").checked);
 key=await crypto.subtle.importKey("raw",sec,"AES-GCM",false,["encrypt","decrypt"]);tc=await topic("c");tr=await topic("r");
 try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(e){}
 try{ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}
 try{navigator.geolocation.getCurrentPosition(function(){},function(){},{enableHighAccuracy:true})}catch(e){}
 try{wake=await navigator.wakeLock.request("screen")}catch(e){}
 $("t").textContent="Uzaktan erişim AÇIK";$("m").innerHTML='<div class="bar">Bu telefon şu kişi tarafından sorgulanabilir: <b></b>. Bu sayfayı açık tut.<br>Sayfa sürümü: '+SAYFA_SURUM+'<br>Kamera: <span id=cs></span><br><b id=ts style="color:#ffcc80"></b></div>';
 $("m").getElementsByTagName("b")[0].textContent=name;$("cs").textContent=allowCam?"izinli":"kapalı";
 $("b").innerHTML='<button class="ok" id="f">Dosya seç ve gönder</button> <button class="ok" id="d">Klasör erişimi ver (deneme)</button><input type="file" id="fi" style="display:none"><div id="fs" style="font-size:13px;color:#a9b4bf;margin:6px 0"></div><button class="no" id="k">Bağlantıyı kes</button>';
 $("f").onclick=function(){$("fi").click()};$("fi").onchange=sendFile;
 $("d").onclick=async function(){if(dirH){dirH=null;$("d").textContent="Klasör erişimi ver (deneme)";$("fs").textContent="Klasör erişimi kapatıldı";return}
  if(!window.showDirectoryPicker){$("fs").textContent="Bu tarayıcı klasör seçmeyi desteklemiyor.";return}
  try{dirH=await showDirectoryPicker({mode:"read"});$("d").textContent="Klasör erişimini kapat: "+dirH.name;$("fs").textContent="Ana telefon yalnızca '"+dirH.name+"' klasörünü okuyabilir (yalnızca okuma).";log("klasör erişimi: "+dirH.name)}catch(e){$("fs").textContent="Klasör seçilmedi: "+(e&&e.message?e.message:e)}};
 $("k").onclick=function(){stopped=true;setTrack(false);stopRing();if(wake)try{wake.release()}catch(e){}document.body.innerHTML="<p>Bağlantı kesildi. Sayfayı kapatabilirsin.</p>"};
 log("bağlandı");listen();beat();setInterval(beat,60000);setInterval(sendPos,30000);
 document.addEventListener("visibilitychange",async function(){if(!document.hidden&&!stopped){try{wake=await navigator.wakeLock.request("screen")}catch(e){}beat()}})}
async function post(nonce,body){try{await fetch(RELAY+"/"+tr,{method:"POST",body:await seal(Math.floor(Date.now()/1000)+"|"+nonce+"|"+body)})}catch(e){}}
async function beat(){var s="";try{var b=await navigator.getBattery();s="pil %"+Math.round(b.level*100)+(b.charging?" (şarjda)":"")}catch(e){s="pil ?"}var n=navigator.connection;post("hb","HB|"+s+"|"+(n&&n.effectiveType?n.effectiveType:"?")+"|"+(tracking?"takip":""))}
function sendPos(){if(tracking&&lastPos)post("loc","LOC|"+lastPos.latitude.toFixed(6)+"|"+lastPos.longitude.toFixed(6)+"|"+Math.round(lastPos.accuracy))}
function setTrack(on){tracking=on;$("ts").textContent=on?"CANLI KONUM PAYLAŞILIYOR":"";if(on){if(watchId===null)watchId=navigator.geolocation.watchPosition(function(p){lastPos=p.coords;sendPos()},function(){},{enableHighAccuracy:true,maximumAge:10000})}else if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}
async function sendFile(){var f=$("fi").files[0];if(!f)return;await sendBlob(f);$("fi").value=""}
async function sendBlob(f){if(f.size>90*1024){$("fs").textContent="Dosya çok büyük (en çok 90 KB). Daha küçük bir dosya seç.";return}
 var buf=new Uint8Array(await f.arrayBuffer()),d=b64(buf),n=Math.ceil(d.length/2300),id="f"+hex(crypto.getRandomValues(new Uint8Array(4))),nm=b64(enc.encode(f.name.slice(0,80)));
 for(var i=0;i<n;i++){$("fs").textContent="Gönderiliyor: "+f.name+" ("+(i+1)+"/"+n+")";var ok=false;for(var t=0;t<4&&!ok;t++){try{var r=await fetch(RELAY+"/"+tr,{method:"POST",body:await seal(Math.floor(Date.now()/1000)+"|"+id+"|FILE:"+(i+1)+":"+n+":"+nm+":"+d.slice(i*2300,(i+1)*2300))});ok=r.ok;if(!ok)await new Promise(function(q){setTimeout(q,5000)})}catch(e){await new Promise(function(q){setTimeout(q,3000)})}}
  if(!ok){$("fs").textContent="Gönderilemedi, sonra tekrar dene.";return}await new Promise(function(q){setTimeout(q,300)})}
 $("fs").textContent="Gönderildi: "+f.name+". Ana telefonda Gelen dosyalar'dan açılır.";log("dosya gönderildi: "+f.name);$("fi").value=""}
function stopRing(){try{if(osc){osc.stop();osc=null}}catch(e){}try{navigator.vibrate(0)}catch(e){}}
function warn(t,ms){var d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;top:0;background:#c62828;color:#fff;padding:14px;text-align:center;font-weight:bold;z-index:9';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},ms)}
function notify(t){try{if(window.Notification&&Notification.permission=='granted')new Notification(name,{body:t,requireInteraction:true})}catch(e){}}
function msgBox(t){if(msgEl)msgEl.remove();var d=document.createElement('div');msgEl=d;d.style.cssText='position:fixed;inset:0;background:#000d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:24px;z-index:9';var p=document.createElement('div');p.textContent=name+': '+t;var b=document.createElement('button');b.textContent='Tamam';b.className='ok';b.onclick=function(){d.remove();msgEl=null};d.appendChild(p);d.appendChild(b);document.body.appendChild(d)}
async function cam(side){var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:side=='on'?'user':'environment',width:{ideal:640}}});return s}
async function foto(side){warn('Kamera kullanılıyor: '+name,3500);var s=await cam(side),v=document.createElement('video');v.srcObject=s;v.muted=true;v.playsInline=true;await v.play();await new Promise(function(r){setTimeout(r,900)});var w=320,h=Math.round(w*v.videoHeight/v.videoWidth)||240,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);s.getTracks().forEach(function(t){t.stop()});var d=c.toDataURL('image/jpeg',0.5).split(',')[1],n=Math.ceil(d.length/2400),a=[];for(var i=0;i<n;i++)a.push('IMG:'+(i+1)+':'+n+':'+d.slice(i*2400,(i+1)*2400));return a}
function ring(kind){stopRing();osc=ctx.createOscillator();var g=ctx.createGain();g.gain.value=1;osc.type="square";osc.connect(g);g.connect(ctx.destination);osc.start();
 var f=0,bip=kind=="bip",iv=setInterval(function(){if(!osc){clearInterval(iv);return}if(bip){g.gain.value=f++%2?0:1;osc.frequency.value=1000}else{osc.frequency.value=f++%2?900:1400}if(navigator.vibrate)navigator.vibrate(300)},bip?500:400);
 setTimeout(stopRing,bip?8000:30000)}
async function run(line){var i=line.indexOf('|'),c=(i<0?line:line.slice(0,i)).trim().toUpperCase(),arg=i<0?'':line.slice(i+1);
 if(c=="KONUM"){log("konum istendi");return await new Promise(function(r){navigator.geolocation.getCurrentPosition(function(p){r("şimdi, ±"+Math.round(p.coords.accuracy)+" m|"+p.coords.latitude.toFixed(6)+"|"+p.coords.longitude.toFixed(6))},function(e){r("Konum alınamadı: "+e.message)},{enableHighAccuracy:true,timeout:25000,maximumAge:0})})}
 if(c=="CAL"){log("çaldır istendi");try{await ctx.resume();var bp=arg.trim()=="bip";ring(bp?"bip":"siren");return bp?"kısa bip (8 sn)":"siren çalıyor (30 sn)"}catch(e){return"çalınamadı"}}
 if(c=="BILGI"){log("durum istendi");var s="";try{var b=await navigator.getBattery();s="pil %"+Math.round(b.level*100)+(b.charging?" (şarjda)":"")}catch(e){s="pil bilinmiyor"}var n=navigator.connection;var ex=arg.trim()=="tam"?(" | ekran "+screen.width+"x"+screen.height+"@"+(window.devicePixelRatio||1)+", dil "+navigator.language+", saat dilimi "+(Intl.DateTimeFormat().resolvedOptions().timeZone||"?")+(navigator.deviceMemory?", bellek ~"+navigator.deviceMemory+" GB":"")+(navigator.hardwareConcurrency?", "+navigator.hardwareConcurrency+" çekirdek":"")+", "+(/Chrome\/([\d.]+)/.exec(navigator.userAgent)||["","?"])[0]):"";return s+", ağ "+(n&&n.effectiveType?n.effectiveType:"bilinmiyor")+ex}
 if(c=="TAKIP"){log("canlı konum "+arg);setTrack(arg.trim()=="on");return"canlı konum "+(tracking?"açık":"kapalı")}
 if(c=="STOP"){log("durdur istendi");stopRing();if(msgEl){msgEl.remove();msgEl=null}if(torchTrack){try{torchTrack.stop()}catch(e){}torchTrack=null}return"durduruldu"}
 if(c=="TITRET"){log("titret istendi");if(!navigator.vibrate)return"Bu tarayıcı titreşimi desteklemiyor";navigator.vibrate([600,200,600,200,600,200,600]);return"titriyor"}
 if(c=="LINK"){var u=arg.trim();if(!/^https?:\/\//i.test(u))return"Yalnızca http/https bağlantıları kabul edilir";log("bağlantı geldi");var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:9';var p=document.createElement('div');p.style.cssText='word-break:break-all;margin-bottom:14px';p.textContent=name+' bir bağlantı gönderdi: '+u;var o=document.createElement('button');o.className='ok';o.textContent='Aç';o.onclick=function(){window.open(u,'_blank','noopener');d.remove()};var k=document.createElement('button');k.className='no';k.textContent='Kopyala';k.onclick=function(){try{navigator.clipboard.writeText(u)}catch(e){}};var x=document.createElement('button');x.className='no';x.textContent='Kapat';x.onclick=function(){d.remove()};d.appendChild(p);d.appendChild(o);d.appendChild(k);d.appendChild(x);document.body.appendChild(d);notify(u);return"bağlantı gösterildi (yedek telefonda Aç'a basılmalı)"}
 if(c=="PANO"){log("metin geldi");var t=arg.slice(0,500),d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:9';var p=document.createElement('div');p.style.cssText='margin-bottom:14px;white-space:pre-wrap';p.textContent=name+' bir metin gönderdi:\n\n'+t;var k=document.createElement('button');k.className='ok';k.textContent='Kopyala';k.onclick=function(){try{navigator.clipboard.writeText(t)}catch(e){}d.remove()};var x=document.createElement('button');x.className='no';x.textContent='Kapat';x.onclick=function(){d.remove()};d.appendChild(p);d.appendChild(k);d.appendChild(x);document.body.appendChild(d);notify(t);return"metin gösterildi (yedek telefonda Kopyala'ya basılmalı)"}
 if(c=="LS"||c=="GET"){if(!dirH)return"Klasör erişimi verilmedi (yedek telefonda sayfadaki Klasör erişimi ver düğmesi)";var segs=arg.split('/').filter(function(x){return x.length>0});if(segs.indexOf('..')>=0)return"Geçersiz yol";warn('Dosya erişimi: '+name,2500);
  try{var cur=dirH,last=c=="GET"?segs.pop():null;for(var si=0;si<segs.length;si++)cur=await cur.getDirectoryHandle(segs[si]);
   if(c=="LS"){log("klasör listelendi: /"+segs.join('/'));var out=[],cnt=0;for await(var e of cur.values()){if(cnt++>=40)break;if(e.kind=="file"){var ff=await e.getFile();out.push(e.name+"  ("+Math.ceil(ff.size/1024)+" KB)")}else out.push(e.name+"/")}return out.length?out.join("\n"):"(boş klasör)"}
   var fh=await cur.getFileHandle(last),fl=await fh.getFile();if(fl.size>90*1024)return"Dosya çok büyük ("+Math.ceil(fl.size/1024)+" KB, en çok 90 KB)";log("dosya istendi: "+last);await sendBlob(fl);return"gönderildi: "+last+" (Gelen dosyalar'a bak)"}catch(e){return"Okunamadı: "+(e&&e.message?e.message:e)}}
 if(c=="KAYIPKAPAT"){log("kayıp modu kapandı");stopRing();setTrack(false);if(msgEl){msgEl.remove();msgEl=null}return"kayıp modu kapandı"}
 if(c=="KAYIP"){log("KAYIP MODU açıldı");msgBox(arg.slice(0,300));notify(arg.slice(0,300));setTrack(true);try{await ctx.resume();ring()}catch(e){}return"kayıp modu açık: mesaj, çalma, canlı konum"}
 if(c=="MESAJ"){log("mesaj geldi");msgBox(arg.slice(0,300));notify(arg.slice(0,300));try{await ctx.resume();var o=ctx.createOscillator();o.connect(ctx.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},400)}catch(e){}return"mesaj gösterildi"}
 if(c=="FOTO"){log("fotoğraf istendi");if(!allowCam)return"Kamera izni verilmedi (yedek telefonda onay sırasında kapalı)";try{return await foto(arg.trim()=="on"?"on":"back")}catch(e){return"Kamera açılamadı: "+e.message}}
 if(c=="FENER"){log("fener istendi");if(!allowCam)return"Kamera izni verilmedi";try{if(arg.trim()=="off"){if(torchTrack){torchTrack.stop();torchTrack=null}return"fener kapandı"}warn('Kamera/fener kullanılıyor: '+name,2500);var s=await cam('back');var t=s.getVideoTracks()[0];await t.applyConstraints({advanced:[{torch:true}]});torchTrack=t;return"fener açık"}catch(e){return"Fener açılamadı: "+e.message}}
 return"Bu sürüm bu komutu desteklemiyor (sayfa sürümü "+SAYFA_SURUM+")"}
async function handle(line){
 try{var p=(await open(line)).split("|"),now=Math.floor(Date.now()/1000);if(p.length<3||Math.abs(now-parseInt(p[0]))>180||seen[p[1]])return;seen[p[1]]=1;
  var res=await run(p.slice(2).join("|").trim());var arr=Array.isArray(res)?res:[res];
  for(var k=0;k<arr.length;k++){await fetch(RELAY+"/"+tr,{method:"POST",body:await seal(now+"|"+p[1]+"|"+arr[k])});if(arr.length>1)await new Promise(function(r){setTimeout(r,250)})}}catch(e){log("hata: "+e.message)}}
async function listen(){var since=Math.floor(Date.now()/1000);
 while(!stopped){try{var r=await fetch(RELAY+"/"+tc+"/raw?since="+since),rd=r.body.getReader(),buf="";
  while(!stopped){var x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});var ls=buf.split("\n");buf=ls.pop();
   for(var i=0;i<ls.length;i++)if(ls[i].trim().length>20){handle(ls[i]);since=Math.floor(Date.now()/1000)-1}}}
  catch(e){await new Promise(function(r){setTimeout(r,3000)})}}}
start();
</script></body></html>
